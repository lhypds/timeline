<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Index</title>
    <style>
      body {
        font-family: "Times New Roman", Times, serif;
        font-size: 16px;
        margin: 0;
        min-height: 100vh;
        box-sizing: border-box;
        padding-bottom: 16vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      h1 {
        font-size: 16px;
        font-weight: normal;
        margin: 0 0 1em;
        text-align: center;
      }

      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        text-align: center;
      }

      li {
        margin: 0.5em 0;
      }

      a {
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <h1>Index</h1>
    <ul>
      <li><a href="philosophy/">philosophy</a></li>
      <li><a href="human/">human</a></li>
      <li><a href="music/">music</a></li>
    </ul>
  </body>
</html>
